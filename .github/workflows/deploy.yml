name: Deploy

# main への push を Cloudflare Workers（static assets）への本番反映トリガーにする。
# 旧 Cloudflare Pages の GitHub 連携に代わる、移行後の唯一の自動デプロイ経路。
on:
  push:
    branches:
      - main
  workflow_dispatch:

# デプロイは取りこぼすと本番が古いままになるため、直列化はするが古い run を kill しない。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  browser-tests:
    needs: ci
    uses: ./.github/workflows/e2e.yml

  deploy:
    name: Deploy Worker (static assets)
    # needs の既定 success() により、静的検証・E2E・Visualの失敗/中断時は走らない。
    needs: [ci, browser-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v6
        with:
          name: static-site-${{ github.sha }}
          path: ${{ runner.temp }}/verified-site

      - name: Verify deployment revision and assets
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p .ci-site
          tar -xf "$RUNNER_TEMP/verified-site/site.tar" -C .ci-site
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          test "$(cat .ci-site/revision.txt)" = "$VERIFIED_SHA"
          python3 scripts/verify-build.py --root . --output .ci-site/dist
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          delete source.build;
          assert.deepEqual(JSON.parse(readFileSync('.ci-site/wrangler.json', 'utf8')), source);
          NODE

      # CLOUDFLARE_API_TOKEN 未設定の間はデプロイを安全にスキップする（main を赤くしないため）。
      # シークレットを登録した次の push から自動で有効化される。
      - name: Check Cloudflare token
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN 未設定のため Worker デプロイをスキップしました。リポジトリ Secrets に登録すると有効化されます。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # 同じ run / SHA の検証済み artifact を、build のない設定で配信する。
      #
      # wranglerVersion を固定する理由: wrangler-action は既定で古い wrangler 3.x を入れる。
      # 本サイトは main スクリプトを持たない assets-only Worker で、3.x は「Missing entry-point」で
      # 拒否する（assets-only 対応は 4.x）。ローカル検証・本番初回デプロイと同じ 4.105.0 に固定する。
      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.105.0"
          workingDirectory: .ci-site
          command: deploy --config wrangler.json

      - name: Smoke production and verify published content
        if: steps.gate.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3; do
            if node scripts/smoke.mjs "https://katachi-ai.com" .ci-site/dist; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
