name: CI

on:
  pull_request:
  # main の検証は Deploy が呼び出す。同じ run の artifact を配信まで渡す。
  workflow_call:
  workflow_dispatch:

# 同一 ref の古い run を自動キャンセル（feature push と PR synchronize の二重消費を防ぐ）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-verify:
    name: Build and verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Test build verifier and smoke
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/smoke.test.mjs

      # 本番（Cloudflare Workers / static assets）と同じビルド手順。スクリプトが壊れたらここで落ちる。
      - name: Build (Cloudflare Workers assets output)
        run: sh scripts/build-cloudflare-pages.sh

      # 公開物の必須ファイルと最低限の HTML 構造を決定論で検証する。
      # 手書き LP に strict な HTML linter を当てると誤検知で赤くなるため、
      # 「壊れたら必ず落ちる」観測量（必須ファイルの存在・DOCTYPE・閉じタグ）に絞る。
      - name: Verify build output
        run: |
          set -eu
          for f in index.html privacy.html robots.txt sitemap.xml favicon.svg; do
            test -f "dist/$f" || { echo "::error::dist/$f が生成されていません"; exit 1; }
          done
          test -d dist/samples || { echo "::error::dist/samples がありません"; exit 1; }
          for html in dist/index.html dist/privacy.html; do
            grep -qi '<!doctype html>' "$html" || { echo "::error::$html に <!DOCTYPE html> がありません"; exit 1; }
            grep -q '</html>' "$html" || { echo "::error::$html が </html> で閉じていません"; exit 1; }
          done
          echo "OK: dist の必須ファイルと HTML 構造を確認"

      # 自動コミット step への CI-skip magic string 混入を決定論で拒否（deploy 取りこぼし再発防止）
      - name: Guard auto-commit steps (no CI-skip magic string)
        run: bash scripts/guard-no-skipci-in-commit-steps.sh

      # 配信専用設定は build を持たない。Wrangler に成果物を再生成させない。
      - name: Package verified assets and revision
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          mkdir -p .ci-site
          cp -R dist .ci-site/dist
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          delete config.build;
          writeFileSync('.ci-site/wrangler.json', JSON.stringify(config, null, 2));
          writeFileSync('.ci-site/revision.txt', process.env.VERIFIED_SHA + '\n');
          NODE
          tar -cf "$RUNNER_TEMP/site.tar" -C .ci-site .

      - uses: actions/upload-artifact@v6
        with:
          name: static-site-${{ github.sha }}
          path: ${{ runner.temp }}/site.tar
          if-no-files-found: error
          # 同一runを「全job再実行」した場合も、同一SHAの検証済み成果物で置き換える。
          overwrite: true
          retention-days: 7
